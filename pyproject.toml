[project]
name = "rag-agent-with-database-routing"
version = "0.1.0"
description = "RAG system that routes queries across three specialized Qdrant databases with a DuckDuckGo web fallback when no relevant documents are found"
requires-python = ">=3.10"

dependencies = [
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "qdrant-client>=1.7.0",
    "fastembed>=0.3.0",
    "ddgs>=9.0.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "liteparse>=0.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
]

# RAGAS benchmark scoring (evaluate_ragas.py). Kept optional because the
# langchain stack is heavy; install with: uv sync --extra eval
[project.optional-dependencies]
eval = [
    "ragas==0.2.15",
    "datasets>=2.0.0",
    "langchain-core>=0.3,<1.0",
    "langchain-community==0.3.27",
    "langchain-groq>=0.2,<1.0",
    "langchain-openai>=0.2,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
